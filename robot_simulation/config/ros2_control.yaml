# ros2_control.yaml
# Controller configuration for palm_harvester
#
# Hardware: gazebo_ros2_control/GazeboSystem (simulation)
#           → swap plugin to libpalm_harvester_hardware.so for real robot
#
# Controllers:
#   joint_state_broadcaster  — publishes /joint_states for all joints
#   diff_drive_controller    — skid-steer tracks via /cmd_vel → /odom
#   arm_trajectory_controller— 5-DOF harvesting arm via FollowJointTrajectory
#   blade_velocity_controller— sickle blade spin speed

# ── Controller Manager ────────────────────────────────────────────────────
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    blade_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# ── Joint State Broadcaster ───────────────────────────────────────────────
# Publishes all hardware state interfaces to /joint_states
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

# ── Differential Drive Controller ────────────────────────────────────────
# Drives left_track_joint / right_track_joint from /cmd_vel,
# publishes /odom and the odom→base_footprint TF.
# Geometry values match URDF properties:
#   wheel_separation = track_y_offset * 2 = 0.61 * 2 = 1.22 m
#   wheel_radius     = track_height  / 2 = 0.50 / 2 = 0.25 m
diff_drive_controller:
  ros__parameters:
    left_wheel_names:  [left_track_joint]
    right_wheel_names: [right_track_joint]

    wheel_separation: 1.22
    wheel_radius:     0.25

    # Odometry
    odom_frame_id:   odom
    base_frame_id:   base_footprint
    open_loop:       false
    enable_odom_tf:  true

    pose_covariance_diagonal:  [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.010]
    twist_covariance_diagonal: [0.001, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.010]

    # Velocity / acceleration limits
    linear:
      x:
        max_velocity:     1.5    # m/s  (forward / reverse)
        min_velocity:    -1.5
        max_acceleration: 1.0    # m/s²
        max_jerk:        .inf
    angular:
      z:
        max_velocity:     1.0    # rad/s
        max_acceleration: 2.0    # rad/s²
        max_jerk:        .inf

    cmd_vel_timeout:          0.5     # s — stop if no cmd within this window
    publish_rate:            50.0     # Hz
    use_stamped_vel:         false
    publish_limited_velocity: true

# ── Arm Trajectory Controller ─────────────────────────────────────────────
# 5-DOF arm: azimuth pan → boom pitch → telescope extend → wrist pitch → wrist roll
# Accepts trajectory goals via /arm_trajectory_controller/follow_joint_trajectory
arm_trajectory_controller:
  ros__parameters:
    joints:
      - arm_pan_joint       # revolute  Z  [-160°, +160°]   effort 120 N·m
      - boom_pitch_joint    # revolute  Y  [  0°,  +75°]    effort 800 N·m
      - boom_extend_joint   # prismatic X  [0.0,  2.0 m]    effort 400 N
      - wrist_pitch_joint   # revolute  Y  [-90°,  +90°]    effort  40 N·m
      - wrist_roll_joint    # revolute  X  [-90°,  +90°]    effort  20 N·m

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate:    50.0   # Hz
    action_monitor_rate:   20.0   # Hz

    allow_partial_joints_goal:              false
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0   # 0 = no wall-clock tolerance on goal completion

      arm_pan_joint:
        goal:       0.010   # rad
        trajectory: 0.050
      boom_pitch_joint:
        goal:       0.010   # rad
        trajectory: 0.050
      boom_extend_joint:
        goal:       0.005   # m
        trajectory: 0.020
      wrist_pitch_joint:
        goal:       0.010   # rad
        trajectory: 0.050
      wrist_roll_joint:
        goal:       0.010   # rad
        trajectory: 0.050

# ── Blade Velocity Controller ─────────────────────────────────────────────
# Controls sickle blade spin speed (0 – 3000 RPM / 0 – 314.16 rad/s).
# Publish a std_msgs/Float64MultiArray to
#   /blade_velocity_controller/commands
# Hardware E-stop disables this joint independently of this controller.
blade_velocity_controller:
  ros__parameters:
    joints:
      - blade_spin_joint
